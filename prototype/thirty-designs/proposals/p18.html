<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE p18 — The Telegraph Office</title>
<style>
@font-face{font-family:Cormorant;src:url('../fonts/cormorant-roman.woff2') format('woff2');font-display:swap}
@font-face{font-family:Cormorant;src:url('../fonts/cormorant-italic.woff2') format('woff2');font-style:italic;font-display:swap}
@font-face{font-family:Spectral;src:url('../fonts/spectral-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Spectral;src:url('../fonts/spectral-500.woff2') format('woff2');font-weight:500;font-display:swap}
:root{--char:#161514;--ox:#7C242B;--gold:#C9A44E;--par:#E6D9B8}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--char);color:var(--par);font:400 15px/1.6 Spectral,Georgia,serif}
h1,.brand,.stamp{font-family:Cormorant,Georgia,serif;font-weight:400}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid rgba(201,164,78,.3)}
.brand{font-size:24px}
.nav{font:500 13px Spectral,serif;color:var(--gold)}
main{max-width:900px;margin:0 auto;padding:18px 20px 44px}
h1{font-size:27px;margin:10px 0 2px}
.note{margin:0 0 16px;font-size:13px;color:rgba(230,217,184,.55)}
.desk{border:1px solid rgba(201,164,78,.28);padding:18px}
.tape{border-top:2px dashed rgba(201,164,78,.55);border-bottom:2px dashed rgba(201,164,78,.55);padding:20px 22px;min-height:132px;background:rgba(201,164,78,.04)}
.tape-copy{margin:0;max-width:720px;min-height:72px}
.key{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:0 20px;border:2px solid var(--gold);border-radius:8px;background:var(--ox);color:var(--par);font:500 15px Spectral,serif;cursor:pointer}
.key:hover{background:#8c2c33}
.knob{width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(201,164,78,.25)}
.hint{min-height:24px;margin:12px 0 0;color:var(--gold);font:500 13px Spectral,serif}
.proof{margin-top:18px;border-top:1px solid rgba(201,164,78,.35);padding-top:14px;display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.proof-copy{flex:1;min-width:240px}
.proof p{margin:0 0 6px}
.ref{font-family:Cormorant,Georgia,serif;font-style:italic;color:var(--gold)}
.stamp{flex:0 0 auto;width:96px;height:96px;border-radius:50%;border:3px solid var(--ox);outline:1px solid rgba(124,36,43,.5);outline-offset:4px;color:var(--ox);display:grid;place-items:center;text-align:center;font-size:13px;transform:rotate(-12deg)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
button.action,button.link{font:500 14px Spectral,serif;color:var(--par);background:transparent;border:1px solid var(--gold);min-height:44px;padding:0 18px;cursor:pointer}
button.action:hover:not(:disabled){background:rgba(201,164,78,.12)}
button.action:disabled{opacity:.35;cursor:not-allowed}
.sealid{font-family:Cormorant,Georgia,serif;color:var(--gold);margin-left:6px}
button.link{border:none;border-bottom:1px solid var(--gold);padding:0 0 3px}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
@media(max-width:820px){main{padding:14px 14px 32px}.brand{font-size:20px}.stamp{width:74px;height:74px;font-size:11px}.tape{padding:16px 12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><span class="brand">Lord of the Mysteries</span><span class="nav">Volume one</span></header>
<main>
<h1>The Telegraph Office</h1>
<p class="note">Chapter one, transmitted</p>
<div class="desk">
<div class="tape"><p class="tape-copy" id="tapeText"></p></div>
<button class="key" id="key" aria-label="Press the brass key to transmit"><span class="knob" aria-hidden="true"></span>Press the brass key</button>
</div>
<p class="hint" id="hint" aria-live="polite">Press the brass key to transmit</p>
<div class="proof" id="proof" hidden>
<div class="proof-copy">
<p>The sound asleep Zhou Mingrui felt an abnormal throbbing pain in his head</p>
<p class="ref">Volume 1, chapter 1 — Crimson</p>
</div>
<div class="stamp" aria-hidden="true">EV-0001-001</div>
</div>
<div class="actions">
<button class="action" id="seal" disabled>Apply the proof stamp <span class="sealid">EV-0001-001</span></button>
<button class="link" id="back" hidden>Tear off the tape</button>
</div>
</main>
<script>
(function(){
  var full='« A gaudy and dazzling dreamworld filled with murmurs instantly shattered. The sound asleep Zhou Mingrui felt an abnormal throbbing pain in his head as though someone had ruthlessly lashed at him with a pole again and again. »';
  var key=document.getElementById('key'),tape=document.getElementById('tapeText'),hint=document.getElementById('hint');
  var proof=document.getElementById('proof'),seal=document.getElementById('seal'),back=document.getElementById('back');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var i=0,timer=null;
  function complete(){seal.disabled=false;hint.textContent='The line is clear';}
  function transmit(){
    if(timer||i>=full.length)return;
    if(reduce){i=full.length;tape.textContent=full;complete();return;}
    timer=setInterval(function(){
      i=Math.min(full.length,i+4);tape.textContent=full.slice(0,i);
      if(i>=full.length){clearInterval(timer);timer=null;complete();}
    },20);
  }
  function reset(){
    if(timer){clearInterval(timer);timer=null;}
    i=0;tape.textContent='';proof.hidden=true;seal.hidden=false;seal.disabled=true;
    key.hidden=false;back.hidden=true;hint.textContent='Press the brass key to transmit';
  }
  key.addEventListener('click',function(){key.hidden=true;back.hidden=false;transmit();});
  seal.addEventListener('click',function(){proof.hidden=false;seal.hidden=true;hint.textContent='The proof stamp is down';});
  back.addEventListener('click',reset);
})();
</script>
</body>
</html>

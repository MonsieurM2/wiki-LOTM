<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — LOTM wiki art direction</title>
<!-- Three radically different directions of the same four screens, switchable via ?variant=A|B|C and ?screen=chapter|entity|graph|search. -->
<style>
:root{ --bg:#0d0c0b; --ink:#e9e2d5; --dim:#9a9080; --gold:#c9a227; --blood:#7c1f2e; --line:#3a342c; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding-bottom:76px}
a{color:var(--gold)}
.topbar{display:flex;align-items:baseline;gap:18px;padding:18px 30px;border-bottom:1px solid var(--line)}
.brand{font-variant:small-caps;letter-spacing:.18em;font-size:1.15rem}
.topbar small{color:var(--dim);letter-spacing:.1em;font:11px system-ui,sans-serif}
.screens{display:flex;gap:4px;padding:10px 30px;border-bottom:1px solid var(--line);font:13px system-ui,sans-serif}
.screens button{background:none;border:1px solid transparent;color:var(--dim);padding:6px 12px;cursor:pointer;border-radius:3px}
.screens button.on{color:var(--ink);border-color:var(--line);background:#1a1714}
.stage{padding:28px 30px;max-width:1200px;margin:0 auto}
.switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;
  background:#f2ede2;color:#17130e;border-radius:99px;padding:9px 16px;box-shadow:0 8px 30px #000a;
  font:600 13px system-ui,sans-serif;z-index:99}
.switcher button{border:0;background:none;font-size:18px;cursor:pointer;color:#17130e}
.note{color:var(--dim);font:12px system-ui,sans-serif;margin:0 0 18px}

/* A — CODEX : manuscript, marginalia, drop cap */
.variant-a .stage{columns:2;column-gap:46px}
.variant-a h1{font-size:2.4rem;font-weight:400;line-height:1.1;margin:0 0 6px;break-after:avoid}
.variant-a h1::first-letter{font-size:4.2rem;color:var(--gold);float:left;line-height:.8;padding:6px 10px 0 0}
.variant-a .kicker{font:11px system-ui,sans-serif;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;break-after:avoid}
.variant-a p{line-height:1.85;margin:0 0 1em;text-align:justify;hyphens:auto}
.variant-a .marg{break-inside:avoid;border-left:2px solid var(--blood);padding:6px 12px;margin:14px 0;
  background:#171310;font:italic 13px/1.5 Georgia,serif;color:#d8c9a8}
.variant-a .marg b{display:block;font:10px system-ui,sans-serif;letter-spacing:.12em;color:var(--gold);margin-bottom:4px}
.variant-a .ribbon{border:1px solid var(--line);padding:14px;break-inside:avoid}
.variant-a .ribbon h2{font-size:1.3rem;font-weight:400;margin:0 0 8px}
.variant-a ul{list-style:none;padding:0;margin:0}
.variant-a li{padding:5px 0;border-bottom:1px dotted var(--line);break-inside:avoid}
.variant-a .sigil{font-size:2rem;color:var(--gold);text-align:center;margin:10px 0;break-inside:avoid}

/* B — OBSERVATORY : dense instrument, three panels */
.variant-b .stage{max-width:none;padding:20px}
.variant-b .grid{display:grid;grid-template-columns:220px 1fr 300px;gap:14px}
.variant-b .panel{border:1px solid var(--line);background:#13110f;padding:14px;min-height:60vh}
.variant-b .panel h2{font:600 11px system-ui,sans-serif;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;margin:0 0 12px}
.variant-b .row{padding:8px 6px;border-bottom:1px solid #26221d;font:13px/1.4 system-ui,sans-serif;cursor:pointer}
.variant-b .row:hover{background:#1d1915}
.variant-b .row.sel{border-left:2px solid var(--gold);background:#1d1915}
.variant-b .row small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.variant-b .doc{font:15px/1.75 Georgia,serif}
.variant-b .doc h1{font-size:1.7rem;font-weight:400;margin:0 0 14px}
.variant-b .ev{border-left:2px solid var(--blood);padding:8px 12px;margin:12px 0;background:#171310}
.variant-b .ev q{font-style:italic}
.variant-b .ev small{display:block;color:var(--dim);font:10px system-ui,sans-serif;margin-top:5px}
.variant-b .stat{display:flex;justify-content:space-between;font:12px system-ui,sans-serif;padding:5px 0;border-bottom:1px solid #26221d}
.variant-b .stat b{color:var(--gold)}
.variant-b svg{width:100%;height:420px}
.variant-b .cmd{width:100%;background:#0b0a09;border:1px solid var(--gold);color:var(--ink);padding:12px;font:14px system-ui,sans-serif;outline:none}
.variant-b .chip{display:inline-block;border:1px solid var(--line);padding:4px 8px;margin:0 4px 8px 0;font:11px system-ui,sans-serif;color:var(--dim);cursor:pointer}

/* C — RITUAL : immersive, cinematic, one column */
.variant-c .stage{max-width:760px;margin:0 auto;text-align:center;padding:8vh 24px}
.variant-c .sig{width:120px;height:120px;margin:0 auto 26px;border:1px solid var(--gold);border-radius:50%;
  display:grid;place-items:center;color:var(--gold);font-size:44px;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
.variant-c h1{font-size:clamp(2.6rem,7vw,5rem);font-weight:400;line-height:1.02;letter-spacing:-.02em;margin:0 0 18px}
.variant-c .kicker{font:11px system-ui,sans-serif;letter-spacing:.4em;text-transform:uppercase;color:var(--gold)}
.variant-c .body-text{font-size:1.15rem;line-height:2;color:#d7cfc0;margin:34px auto;max-width:60ch}
.variant-c .reveal{position:relative;display:inline-block;border-bottom:1px dotted var(--gold);cursor:help}
.variant-c .reveal span{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:130%;width:300px;
  background:#1b1712;border:1px solid var(--gold);padding:12px;font:italic 13px/1.5 Georgia,serif;z-index:5}
.variant-c .reveal:hover span{display:block}
.variant-c .timeline{border-top:1px solid var(--line);margin-top:40px;padding-top:20px;font:12px system-ui,sans-serif;color:var(--dim)}
.variant-c .timeline div{padding:8px 0;border-bottom:1px solid #201c18}
.variant-c .searchbig{width:100%;background:none;border:0;border-bottom:1px solid var(--gold);color:var(--ink);
  font:2rem Georgia,serif;text-align:center;padding:14px;outline:none}
.variant-c .result{padding:16px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink);text-decoration:none;display:block}
.variant-c .result small{color:var(--gold);font:10px system-ui,sans-serif;letter-spacing:.16em}
.variant-c .orbit{position:relative;width:420px;height:420px;margin:20px auto}
.variant-c .node{position:absolute;transform:translate(-50%,-50%);border:1px solid var(--line);border-radius:50%;
  padding:8px;font:11px system-ui,sans-serif;background:#14110e;white-space:nowrap}
.variant-c .node.core{border-color:var(--gold);color:var(--gold);font-size:13px}
/* ---- refinement pass ---- */
body{background:radial-gradient(1200px 600px at 50% -10%,#1a1511 0%,#0d0c0b 60%)}
.topbar .brand::after{content:'◆';color:var(--gold);font-size:9px;margin-left:12px;vertical-align:middle;opacity:.7}
.variant-a .stage{columns:2;column-gap:72px}
.variant-a .kicker::after{content:'';display:block;width:52px;border-top:1px solid var(--gold);margin:9px 0 14px;opacity:.7}
.variant-a h1{font-size:2.75rem}
.variant-a p{font-size:16px;line-height:1.95;color:#e4ddd0}
.variant-a .marg{background:linear-gradient(90deg,#1c1611,#14110e);border-left:1px solid var(--blood);border-radius:2px;font-size:12px;padding:9px 13px}
.variant-a .marg b{font-variant:small-caps;letter-spacing:.14em}
.variant-a .sigil{font-size:3rem;letter-spacing:.35em;color:#b9952f;opacity:.8}
.variant-b .stage{background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:32px 32px}
.variant-b .panel{background:#13110fee;box-shadow:inset 0 1px #ffffff08}
.variant-b .panel h2{border-bottom:1px solid var(--line);padding-bottom:9px;letter-spacing:.24em}
.variant-b .doc h1{font-size:2.15rem;letter-spacing:-.01em;border-bottom:1px solid var(--line);padding-bottom:16px}
.variant-b .row{border-bottom:1px solid #302a22}
.variant-b .ev{background:#1b1510;border-left:1px solid var(--blood)}
.variant-c .sig{width:150px;height:150px;font-size:54px;border-color:#c9a22788;box-shadow:0 0 60px #c9a22718,inset 0 0 40px #c9a22710}
.variant-c .body-text{text-align:left;max-width:46ch;font-size:1.08rem;line-height:2.05;color:#ded5c5}
.variant-c h1{text-shadow:0 4px 40px #000}
.variant-c .kicker{letter-spacing:.5em}
.variant-c .result{text-align:left}
@media (max-width:900px){
  .variant-a .stage{columns:1}.variant-b .grid{grid-template-columns:1fr}.variant-c .orbit{width:300px;height:300px}
  .variant-c h1{font-size:2.6rem}.variant-a h1{font-size:2.2rem}
}
@media (prefers-reduced-motion:reduce){.variant-c .sig{animation:none;opacity:.85}}
</style>
</head>
<body>
<header class="topbar"><span class="brand">Lord of the Mysteries</span><small id="crumb"></small></header>
<nav class="screens" id="screens"></nav>
<main class="stage" id="stage"></main>
<div class="switcher">
  <button id="prev" aria-label="previous variant">←</button>
  <span id="vlabel"></span>
  <button id="next" aria-label="next variant">→</button>
</div>
<script>
const VARIANTS = [
  {key:'A',name:'Codex / Manuscript'},
  {key:'B',name:'Observatory / Instrument'},
  {key:'C',name:'Ritual / Immersive'}
];
const SCREENS = [
  {key:'chapter',label:'Chapter'},
  {key:'entity',label:'Entity'},
  {key:'graph',label:'Graph'},
  {key:'search',label:'Search'}
];
const DATA = {
  chapter:{
    book:'Volume 1 — Clown', title:'Chapter 1: Crimson',
    paras:[
      'Painful! How painful! My head hurts so badly!',
      'A gaudy and dazzling dreamworld filled with murmurs instantly shattered. The sound asleep Zhou Mingrui felt an abnormal throbbing pain in his head as though someone had ruthlessly lashed at him with a pole again and again.',
      'Ouch... In his stupor, Zhou Mingrui attempted to turn around, look up, and sit up; however, he was completely unable to move his limbs as though he had lost control over his body.',
      'Is this the present me? Klein Moretti?',
      'A clear reflection appeared in the mirror. His temple had a grotesque wound with burn marks along its periphery. Blood stained the wound’s surroundings and there were grayish-white brain juices squirming slowly within.'
    ],
    quotes:[
      {label:'EV-0001-001',text:'The sound asleep Zhou Mingrui felt an abnormal throbbing pain in his head'},
      {label:'EV-0001-002',text:'Is this the present me? Klein Moretti?'},
      {label:'EV-0001-003',text:'A clear reflection appeared in the mirror. His temple had a grotesque wound'}
    ]
  },
  entity:{
    name:'Klein Moretti', type:'Character', aliases:['Klein','Mr. Fool (later)'],
    facts:[
      {label:'First appearance',value:'Chapter 1 — Crimson'},
      {label:'Location',value:'City of Tingen, Loen Kingdom'},
      {label:'Affiliation',value:'Khoy University · Nighthawks'},
      {label:'Mentions',value:'146 in Volume 1'}
    ],
    events:[
      {ch:1,label:'Wakes in pain, discovers the wound'},
      {ch:2,label:'Finds a yellow bullet by the wall'},
      {ch:3,label:'Repairs the pocket watch with Melissa'}
    ]
  },
  graph:{
    nodes:['Klein Moretti','Zhou Mingrui','Tingen','Loen Kingdom','Khoy University','Melissa','Mr. Fool'],
    edges:[
      ['Klein Moretti','Zhou Mingrui','RELATED_TO'],
      ['Klein Moretti','Tingen','LOCATED_IN'],
      ['Tingen','Loen Kingdom','LOCATED_IN'],
      ['Klein Moretti','Khoy University','MEMBER_OF'],
      ['Klein Moretti','Melissa','RELATED_TO'],
      ['Klein Moretti','Mr. Fool','RELATED_TO']
    ]
  },
  search:{
    results:[
      {type:'Chapter',name:'Chapter 1: Crimson',where:'Vol. 1 · opening'},
      {type:'Character',name:'Klein Moretti',where:'146 mentions'},
      {type:'Location',name:'City of Tingen',where:'Vol. 1–2'},
      {type:'Event',name:'The crimson moon over Tingen',where:'Ch. 1, 67, 129'},
      {type:'Concept',name:'Transmigration',where:'Ch. 1–2'}
    ]
  }
};
const q = new URLSearchParams(location.search);
let variant = q.get('variant') || 'A';
let screen = q.get('screen') || 'chapter';
function sync(){ q.set('variant',variant); q.set('screen',screen); history.replaceState(null,'','?'+q.toString()); render(); }
function render(){
  document.body.className = 'variant-'+variant.toLowerCase();
  document.getElementById('crumb').textContent = VARIANTS.find(v=>v.key===variant).name.toUpperCase()+' / '+SCREENS.find(s=>s.key===screen).label.toUpperCase();
  document.getElementById('vlabel').textContent = variant+' ('+VARIANTS.find(v=>v.key===variant).name+')';
  document.getElementById('screens').innerHTML = SCREENS.map(s=>`<button data-screen="${s.key}" class="${s.key===screen?'on':''}">${s.label}</button>`).join('');
  document.querySelectorAll('#screens button').forEach(b=>b.onclick=()=>{screen=b.dataset.screen;sync();});
  document.getElementById('stage').innerHTML = ({A:renderA,B:renderB,C:renderC})[variant](screen);
}
function renderA(s){
  const d=DATA;
  if(s==='chapter') return `<p class="note">Manuscript — evidence sits in the margin, beside the line it justifies.</p>
    <div class="kicker">${d.chapter.book}</div><h1>${d.chapter.title}</h1>
    <div class="sigil">☾ ✦ ☾</div>
    ${d.chapter.paras.map((p,i)=>p+(i===1?`<div class="marg"><b>${d.chapter.quotes[0].label}</b>${d.chapter.quotes[0].text}</div>`:'')+(i===3?`<div class="marg"><b>${d.chapter.quotes[1].label}</b>${d.chapter.quotes[1].text}</div>`:'')).join('<br>')}
    <div class="marg"><b>${d.chapter.quotes[2].label}</b>${d.chapter.quotes[2].text}</div>`;
  if(s==='entity') return `<p class="note">An illuminated leaf: name, aliases, then the chronology of interventions.</p>
    <div class="sigil">✧</div><div class="kicker">${d.entity.type} · fiche</div><h1>${d.entity.name}</h1>
    <div class="ribbon"><h2>Aliases</h2><p>${d.entity.aliases.join(' · ')}</p></div>
    <div class="ribbon"><h2>Chronology</h2><ul>${d.entity.events.map(e=>`<li><b>Ch. ${e.ch}</b> — ${e.label}</li>`).join('')}</ul></div>
    <div class="ribbon"><h2>Facts</h2><ul>${d.entity.facts.map(f=>`<li>${f.label}: ${f.value}</li>`).join('')}</ul></div>`;
  if(s==='graph') return `<p class="note">The graph as a written concordance — relations read as sentences.</p>
    <div class="kicker">Concordance of relations</div><h1>The web of names</h1><ul>
    ${d.graph.edges.map(e=>`<li>${e[0]} <b>${e[2].replace('_',' ')}</b> ${e[1]}</li>`).join('')}</ul>`;
  return `<p class="note">Search as an index: results grouped by the eight closed entity types.</p>
    <div class="kicker">Index of the work</div><h1>Find a name</h1><ul>${d.search.results.map(r=>`<li><b>${r.type}</b> — ${r.name} <small>(${r.where})</small></li>`).join('')}</ul>`;
}
function renderB(s){
  const d=DATA;
  const left=d.graph.nodes.map((n,i)=>`<div class="row ${i===0?'sel':''}">${n}<small>${i===0?'Character':'Entity'}</small></div>`).join('');
  const inspector=d.chapter.quotes.map(x=>`<div class="ev"><q>${x.text}</q><small>${x.label} · confirmed</small></div>`).join('');
  if(s==='chapter') return `<p class="note">Instrument panel: reading on the left, evidence pinned on the right.</p><div class="grid">
    <div class="panel"><h2>Corpus</h2>${left}</div>
    <div class="panel doc"><h1>${d.chapter.title}</h1><small>${d.chapter.book}</small>${d.chapter.paras.map(p=>`<p>${p}</p>`).join('')}</div>
    <div class="panel"><h2>Evidence inspector</h2>${inspector}</div></div>`;
  if(s==='entity') return `<p class="note">A record with measurable fields and a legible relation table.</p><div class="grid">
    <div class="panel"><h2>Types</h2>${['Character','Event','Location','Artifact','Pathway','Concept'].map((t,i)=>`<div class="row ${i===0?'sel':''}">${t}<small>${[146,35,23,11,8,17][i]} entities</small></div>`).join('')}</div>
    <div class="panel doc"><h1>${d.entity.name}</h1><div class="stat"><span>Primary type</span><b>${d.entity.type}</b></div>
      ${d.entity.facts.map(f=>`<div class="stat"><span>${f.label}</span><b>${f.value}</b></div>`).join('')}
      <h2 style="margin-top:18px;color:var(--gold);font:600 11px system-ui">Relations</h2>
      ${d.graph.edges.filter(e=>e[0]===d.entity.name).map(e=>`<div class="ev"><b>${e[2]}</b><br>${e[1]}<small>${e[2]} · 1 evidence</small></div>`).join('')}</div>
    <div class="panel"><h2>Aliases & tags</h2>${d.entity.aliases.map(a=>`<div class="chip">${a}</div>`).join('')}
      <div class="stat"><span>verified facts</span><b>52</b></div><div class="stat"><span>corrected</span><b>11</b></div></div></div>`;
  if(s==='graph') return `<p class="note">A constellation: nodes and typed edges drawn, not listed.</p><div class="grid" style="grid-template-columns:200px 1fr 240px">
    <div class="panel"><h2>Filters</h2>${['Character','Location','Pathway','Concept'].map(t=>`<div class="chip">${t}</div>`).join('')}</div>
    <div class="panel"><h2>Relation graph</h2><svg viewBox="0 0 600 420">
      ${d.graph.edges.map((e,i)=>{const a=100+i*65,b=120+(i%3)*90;return `<line x1="300" y1="210" x2="${a}" y2="${b}" stroke="#5d5140" stroke-width="1"/><text x="${a}" y="${b-8}" fill="#c9a227" font-size="10" font-family="system-ui">${e[2]}</text>`}).join('')}
      <circle cx="300" cy="210" r="42" fill="#1b1712" stroke="#c9a227"/><text x="300" y="214" fill="#e9e2d5" text-anchor="middle" font-size="11">Klein Moretti</text>
      ${d.graph.nodes.slice(1).map((n,i)=>`<circle cx="${100+i*65}" cy="${120+(i%3)*90}" r="4" fill="#7c1f2e"/><text x="${100+i*65}" y="${138+(i%3)*90}" fill="#9a9080" font-size="10" text-anchor="middle">${n}</text>`).join('')}
    </svg></div>
    <div class="panel"><h2>Selected</h2><div class="stat"><span>node</span><b>Klein Moretti</b></div>
      <div class="stat"><span>degree</span><b>6</b></div><div class="stat"><span>chapters</span><b>341</b></div></div></div>`;
  return `<p class="note">A command palette: query first, filters inline, results dense.</p><div class="grid" style="grid-template-columns:1fr 300px">
    <div class="panel"><input class="cmd" value="crimson moon" aria-label="query"><div style="margin-top:14px">
    ${d.search.results.map(r=>`<div class="row">${r.name}<small>${r.type} · ${r.where}</small></div>`).join('')}</div></div>
    <div class="panel"><h2>Facets</h2>${['Character','Event','Chapter','Location'].map(t=>`<div class="chip">${t}</div>`).join('')}
    <h2 style="margin-top:18px;color:var(--gold);font:600 11px system-ui">Sort</h2><div class="chip">Relevance</div><div class="chip">Chapter</div></div></div>`;
}
function renderC(s){
  const d=DATA;
  if(s==='chapter') return `<div class="sig">☾</div><div class="kicker">${d.chapter.book}</div><h1>${d.chapter.title}</h1>
    <p class="body-text">${d.chapter.paras.map((p,i)=>i===1?`A gaudy and dazzling dreamworld filled with murmurs instantly shattered. <span class="reveal">The sound asleep Zhou Mingrui felt an abnormal throbbing pain in his head<span>${d.chapter.quotes[0].label} · Vol. 1, Ch. 1</span></span> as though someone had ruthlessly lashed at him with a pole again and again.`:p).join(' ')}</p>
    <div class="timeline"><div>← Previous · Chapter 0</div><div>Next · ${'Chapter 2: Situation'} →</div></div>`;
  if(s==='entity') return `<div class="sig">✧</div><div class="kicker">Character · fiche</div><h1>${d.entity.name}</h1>
    <p class="body-text">Also known as ${d.entity.aliases.join(', ')}. ${d.entity.facts[1].value}.</p>
    <div class="timeline">${d.entity.events.map(e=>`<div>Ch. ${e.ch} — ${e.label}</div>`).join('')}</div>`;
  if(s==='graph') { const pos=[[50,50],[22,24],[78,26],[18,70],[80,72],[50,88],[50,12]];
    return `<div class="kicker">The web</div><h1>Every name, a star</h1><div class="orbit">
    ${d.graph.nodes.map((n,i)=>`<div class="node ${i===0?'core':''}" style="left:${pos[i][0]}%;top:${pos[i][1]}%">${n}</div>`).join('')}</div>`; }
  return `<div class="sig">☽</div><div class="kicker">Search the whole work</div><h1>Summon a name</h1>
    <input class="searchbig" value="crimson" aria-label="query">
    <div style="margin-top:34px">${d.search.results.map(r=>`<a class="result" href="#"><small>${r.type.toUpperCase()}</small><br>${r.name}</a>`).join('')}</div>`;
}
function cycle(step){
  let i=VARIANTS.findIndex(v=>v.key===variant);
  i=(i+step+VARIANTS.length)%VARIANTS.length; variant=VARIANTS[i].key; sync();
}
document.getElementById('prev').onclick=()=>cycle(-1);
document.getElementById('next').onclick=()=>cycle(1);
addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)||document.activeElement.isContentEditable) return;
  if(e.key==='ArrowLeft')cycle(-1); if(e.key==='ArrowRight')cycle(1);
});
render();
</script>
</body>
</html>

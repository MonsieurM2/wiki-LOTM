<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — LOTM wiki art direction</title>
<!-- Deep refinement after a design plan: see DESIGN-PLAN.md. Three structural directions, ?variant=A|B|C and ?screen=chapter|entity|graph|search. -->
<style>
@font-face{font-family:Cormorant;src:url('fonts/cormorant-roman.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:Cormorant;src:url('fonts/cormorant-italic.woff2') format('woff2');font-weight:400 700;font-style:italic;font-display:swap}
@font-face{font-family:Spectral;src:url('fonts/spectral-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Spectral;src:url('fonts/spectral-500.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:Spectral;src:url('fonts/spectral-italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap}
:root{--ink:#070605;--vellum:#e9e1d0;--gold:#b9952f;--oxblood:#6d1f2b;--ash:#9a9080;--veil:#14100d;--line:#2c261f}
*{box-sizing:border-box}
#progress{position:fixed;top:0;left:0;height:2px;background:var(--gold);width:0;z-index:100;transition:width .12s linear}
.variant-a .draw{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);break-inside:avoid}
.variant-a .draw button{background:none;border:1px solid var(--gold);color:var(--gold);padding:8px 14px;cursor:pointer;font-size:.8125rem}
.variant-a .card{display:inline-block;margin-left:14px;padding:8px 12px;border:1px solid var(--line);min-width:210px;color:var(--ash);font-style:italic;font-size:.875rem}
.variant-a .card.shown{color:var(--vellum);border-color:var(--gold)}
body{margin:0;background:var(--ink);color:var(--vellum);font:400 1.0625rem/1.75 Spectral,Georgia,serif;min-height:100vh;padding-bottom:84px}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.topbar{display:flex;align-items:baseline;gap:22px;padding:22px 34px;border-bottom:1px solid var(--line)}
.brand{font:500 1.45rem/1 Cormorant,Georgia,serif;letter-spacing:.02em}
.topbar small{color:var(--ash);font-size:.8125rem}
.screens{display:flex;gap:6px;padding:12px 34px;border-bottom:1px solid var(--line)}
.screens button{background:none;border:1px solid transparent;padding:6px 14px;cursor:pointer;color:var(--ash);font-size:.8125rem}
.screens button.on{color:var(--vellum);border-color:var(--line)}
.stage{padding:34px;max-width:1240px;margin:0 auto}
.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;
  background:var(--vellum);color:var(--ink);padding:9px 18px;border-radius:2px;box-shadow:0 10px 40px #000c;
  font-size:.8125rem;z-index:99}
.switcher button{border:0;background:none;font-size:1.1rem;cursor:pointer;color:var(--ink)}
.note{color:var(--ash);font-size:.8125rem;margin:0 0 24px;max-width:68ch}

/* A — CODEX: manuscript, glosses in the outer margin */
.variant-a .stage{columns:2;column-gap:82px;text-align:left}
.variant-a h1{font:500 3.25rem/1.04 Cormorant,Georgia,serif;margin:0 0 18px;break-after:avoid}
.variant-a h1::first-letter{font-size:5.2rem;color:var(--gold);float:left;line-height:.74;padding:8px 12px 0 0}
.variant-a .kicker{font-size:.8125rem;color:var(--ash);break-after:avoid}
.variant-a .kicker::after{content:'';display:block;width:46px;border-top:1px solid var(--gold);margin:12px 0 20px;opacity:.6}
.variant-a p{margin:0 0 1.05em;max-width:66ch;line-height:1.85}
.variant-a .marg{break-inside:avoid;border-left:1px solid var(--oxblood);background:var(--veil);padding:10px 14px;margin:18px 0;
  font-style:italic;font-size:.875rem;line-height:1.6;color:#d3c8b4}
.variant-a .marg b{display:block;font:400 .75rem/1.4 Spectral,sans-serif;color:var(--ash);margin-bottom:4px}
.variant-a .sigil{font:400 2.2rem/1 Cormorant,serif;color:var(--gold);letter-spacing:.4em;margin:8px 0 26px;break-inside:avoid}
.variant-a .ribbon{break-inside:avoid;padding:16px 0;border-top:1px solid var(--line)}
.variant-a .ribbon h2{font:500 1.5rem/1.2 Cormorant,serif;margin:0 0 12px}
.variant-a ul{list-style:none;padding:0;margin:0}
.variant-a li{padding:7px 0;border-bottom:1px solid var(--line);break-inside:avoid;font-size:.9375rem}

/* B — OBSERVATORY: an instrument, three panes, no decoration */
.variant-b .stage{max-width:none;padding:22px}
.variant-b .grid{display:grid;grid-template-columns:230px 1fr 310px;gap:16px}
.variant-b .panel{border:1px solid var(--line);background:var(--veil);padding:16px;min-height:64vh}
.variant-b .panel h2{font:500 .8125rem/1.4 Spectral,sans-serif;color:var(--gold);margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.variant-b .row{padding:9px 7px;border-bottom:1px solid var(--line);font-size:.875rem;cursor:pointer}
.variant-b .row:hover{background:#1c1713}
.variant-b .row.sel{border-left:2px solid var(--gold);background:#1c1713}
.variant-b .row small{display:block;color:var(--ash);font-size:.75rem;margin-top:2px}
.variant-b .doc h1{font:500 2.4rem/1.1 Cormorant,serif;margin:0 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.variant-b .doc p{margin:0 0 1.1em;line-height:1.8}
.variant-b .ev{border-left:1px solid var(--oxblood);padding:9px 13px;margin:12px 0;background:#191410}
.variant-b .ev q{font-style:italic;color:#d9ceb9}
.variant-b .ev small{display:block;color:var(--ash);font-size:.75rem;margin-top:6px}
.variant-b .stat{display:flex;justify-content:space-between;gap:12px;font-size:.8125rem;padding:7px 0;border-bottom:1px solid var(--line)}
.variant-b .stat b{color:var(--gold);font-weight:500;text-align:right}
.variant-b svg{width:100%;height:420px}
.variant-b .cmd{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--vellum);padding:12px;font-size:1rem}
.variant-b .chip{display:inline-block;border:1px solid var(--line);padding:5px 10px;margin:0 6px 8px 0;font-size:.75rem;color:var(--ash);cursor:pointer}

/* C — RITUAL: one slow moment, then quiet reading */
.variant-c .stage{max-width:720px;margin:0 auto;padding:8vh 24px;text-align:left}
.variant-c .sig{width:132px;height:132px;margin:0 0 34px;border:1px solid #b9952f66;border-radius:50%;
  display:grid;place-items:center;color:var(--gold);font:400 3rem/1 Cormorant,serif;
  background:radial-gradient(circle,#b9952f18 0%,transparent 70%);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
.variant-c h1{font:500 clamp(2.7rem,6.5vw,4.2rem)/1.02 Cormorant,serif;margin:0 0 22px}
.variant-c .kicker{font-size:.8125rem;color:var(--ash)}
.variant-c .body-text{font-size:1.1rem;line-height:2;color:#ded5c5;margin:36px 0;max-width:62ch}
.variant-c .reveal{border-bottom:1px dotted var(--gold);cursor:help;position:relative}
.variant-c .reveal span{display:none;position:absolute;left:0;top:140%;width:min(340px,80vw);background:var(--veil);
  border-left:1px solid var(--gold);padding:12px;font:italic .875rem/1.55 Spectral,serif;z-index:5}
.variant-c .reveal:hover span{display:block}
.variant-c .timeline{border-top:1px solid var(--line);margin-top:44px;padding-top:16px;font-size:.8125rem;color:var(--ash)}
.variant-c .timeline div{padding:9px 0;border-bottom:1px solid var(--line)}
.variant-c .searchbig{width:100%;background:none;border:0;border-bottom:1px solid var(--gold);color:var(--vellum);
  font:500 2rem/1.4 Cormorant,serif;padding:14px 0;outline:none}
.variant-c .result{display:block;padding:15px 0;border-bottom:1px solid var(--line);color:var(--vellum);text-decoration:none}
.variant-c .result small{display:block;color:var(--ash);font-size:.75rem}
.variant-c .orbit{position:relative;width:400px;height:400px;margin:24px auto}
.variant-c .node{position:absolute;transform:translate(-50%,-50%);border:1px solid var(--line);border-radius:50%;
  padding:8px;font-size:.75rem;background:var(--veil);white-space:nowrap}
.variant-c .node.core{border-color:var(--gold);color:var(--gold);font-size:.875rem}
@media (max-width:900px){.variant-a .stage{columns:1}.variant-b .grid{grid-template-columns:1fr}
  .variant-c .orbit{width:300px;height:300px}.variant-c h1{font-size:2.7rem}.variant-a h1{font-size:2.4rem}}
@media (prefers-reduced-motion:reduce){.variant-c .sig{animation:none;opacity:.85}}
</style>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<header class="topbar"><span class="brand">Lord of the Mysteries</span><small id="crumb"></small></header>
<nav class="screens" id="screens"></nav>
<main class="stage" id="stage"></main>
<div class="switcher">
  <button id="prev" aria-label="Previous direction">&#8592;</button>
  <span id="vlabel"></span>
  <button id="next" aria-label="Next direction">&#8594;</button>
</div>
<script>
const VARIANTS=[{key:'A',name:'Codex manuscript'},{key:'B',name:'Observatory instrument'},{key:'C',name:'Ritual immersive'}];
const SCREENS=[{key:'chapter',label:'Chapter'},{key:'entity',label:'Entity'},{key:'graph',label:'Graph'},{key:'search',label:'Search'}];
const DATA={
 chapter:{book:'Volume 1, Clown',title:'Chapter 1: Crimson',
  paras:['Painful! How painful! My head hurts so badly!',
   'A gaudy and dazzling dreamworld filled with murmurs instantly shattered. The sound asleep Zhou Mingrui felt an abnormal throbbing pain in his head as though someone had ruthlessly lashed at him with a pole again and again.',
   'Ouch... In his stupor, Zhou Mingrui attempted to turn around, look up, and sit up; however, he was completely unable to move his limbs as though he had lost control over his body.',
   'Is this the present me? Klein Moretti?',
   'A clear reflection appeared in the mirror. His temple had a grotesque wound with burn marks along its periphery. Blood stained the wound’s surroundings and there were grayish-white brain juices squirming slowly within.'],
  quotes:[{label:'EV-0001-001',text:'The sound asleep Zhou Mingrui felt an abnormal throbbing pain in his head'},
   {label:'EV-0001-002',text:'Is this the present me? Klein Moretti?'},
   {label:'EV-0001-003',text:'A clear reflection appeared in the mirror. His temple had a grotesque wound'}]},
 entity:{name:'Klein Moretti',type:'Character',aliases:['Klein','Mr. Fool, later'],
  facts:[{label:'First appearance',value:'Chapter 1, Crimson'},
   {label:'Location',value:'City of Tingen, Loen Kingdom'},
   {label:'Affiliation',value:'Khoy University and the Nighthawks'},
   {label:'Mentions',value:'146 in Volume 1'}],
  events:[{ch:1,label:'Wakes in pain and discovers the wound'},
   {ch:2,label:'Finds a yellow bullet by the wall'},
   {ch:3,label:'Repairs the pocket watch with Melissa'}]},
 graph:{nodes:['Klein Moretti','Zhou Mingrui','Tingen','Loen Kingdom','Khoy University','Melissa','Mr. Fool'],
  edges:[['Klein Moretti','Zhou Mingrui','RELATED_TO'],['Klein Moretti','Tingen','LOCATED_IN'],
   ['Tingen','Loen Kingdom','LOCATED_IN'],['Klein Moretti','Khoy University','MEMBER_OF'],
   ['Klein Moretti','Melissa','RELATED_TO'],['Klein Moretti','Mr. Fool','RELATED_TO']]},
 search:{results:[{type:'Chapter',name:'Chapter 1: Crimson',where:'Volume 1, opening'},
   {type:'Character',name:'Klein Moretti',where:'146 mentions'},
   {type:'Location',name:'City of Tingen',where:'Volumes 1 and 2'},
   {type:'Event',name:'The crimson moon over Tingen',where:'Chapters 1, 67, 129'},
   {type:'Concept',name:'Transmigration',where:'Chapters 1 and 2'}]}
};
const q=new URLSearchParams(location.search);
let variant=q.get('variant')||'A',screen=q.get('screen')||'chapter';
function sync(){q.set('variant',variant);q.set('screen',screen);history.replaceState(null,'','?'+q.toString());render()}
function render(){
 document.body.className='variant-'+variant.toLowerCase();
 const v=VARIANTS.find(x=>x.key===variant).name,s=SCREENS.find(x=>x.key===screen).label.toLowerCase();
 document.getElementById('crumb').textContent=v+', '+s;
 document.getElementById('vlabel').textContent=v+' ('+variant+')';
 document.getElementById('screens').innerHTML=SCREENS.map(x=>`<button data-screen="${x.key}" class="${x.key===screen?'on':''}">${x.label}</button>`).join('');
 document.querySelectorAll('#screens button').forEach(b=>b.onclick=()=>{screen=b.dataset.screen;sync()});
 document.getElementById('stage').innerHTML=({A:renderA,B:renderB,C:renderC})[variant](screen);
 const draw=document.getElementById('draw');
 if(draw) draw.onclick=()=>{const cards=['Chapter 67, Response','Chapter 129, Rampager','Chapter 302, Miss Sharron','Chapter 999, Shermane','Chapter 1394, A New Journey'];
  const card=document.getElementById('card');card.textContent=cards[Math.floor(Math.random()*cards.length)];card.classList.add('shown')};
}
function renderA(s){
 const d=DATA;
 if(s==='chapter') return `<p class="note">The proof sits in the margin, beside the line it justifies.</p>
  <div class="kicker">${d.chapter.book}</div><h1>${d.chapter.title}</h1><div class="sigil">&#9790; &#10022; &#9790;</div>
  ${d.chapter.paras.map((p,i)=>p+(i===1?`<div class="marg"><b>${d.chapter.quotes[0].label}</b>${d.chapter.quotes[0].text}</div>`:'')+(i===3?`<div class="marg"><b>${d.chapter.quotes[1].label}</b>${d.chapter.quotes[1].text}</div>`:'')).join('<br>')}
  <div class="marg"><b>${d.chapter.quotes[2].label}</b>${d.chapter.quotes[2].text}</div>
  <div class="draw"><button id="draw" type="button">Draw a chapter</button><span class="card" id="card">The card turns when you ask.</span></div>`;
 if(s==='entity') return `<p class="note">A name, its other forms, then the order of its interventions.</p>
  <div class="sigil">&#10023;</div><div class="kicker">${d.entity.type}</div><h1>${d.entity.name}</h1>
  <div class="ribbon"><h2>Other names</h2><p>${d.entity.aliases.join(' and ')}</p></div>
  <div class="ribbon"><h2>Order of events</h2><ul>${d.entity.events.map(e=>`<li>Chapter ${e.ch}. ${e.label}</li>`).join('')}</ul></div>
  <div class="ribbon"><h2>Facts</h2><ul>${d.entity.facts.map(f=>`<li>${f.label}: ${f.value}</li>`).join('')}</ul></div>`;
 if(s==='graph') return `<p class="note">Relations read as sentences rather than drawn as lines.</p>
  <div class="kicker">Concordance of relations</div><h1>The web of names</h1><ul>
  ${d.graph.edges.map(e=>`<li>${e[0]} ${e[2].replace('_',' ').toLowerCase()} ${e[1]}</li>`).join('')}</ul>`;
 return `<p class="note">An index by the eight closed kinds of entity.</p><div class="kicker">Index of the work</div>
  <h1>Find a name</h1><ul>${d.search.results.map(r=>`<li><b>${r.type}</b> &mdash; ${r.name} (${r.where})</li>`).join('')}</ul>`;
}
function renderB(s){
 const d=DATA,left=d.graph.nodes.map((n,i)=>`<div class="row ${i===0?'sel':''}">${n}<small>${i===0?'Character':'Entity'}</small></div>`).join('');
 const inspector=d.chapter.quotes.map(x=>`<div class="ev"><q>${x.text}</q><small>${x.label}, confirmed</small></div>`).join('');
 if(s==='chapter') return `<p class="note">Reading in the middle, names on the left, evidence on the right.</p><div class="grid">
  <div class="panel"><h2>Names in this chapter</h2>${left}</div>
  <div class="panel doc"><h1>${d.chapter.title}</h1><p>${d.chapter.book}</p>${d.chapter.paras.map(p=>`<p>${p}</p>`).join('')}</div>
  <div class="panel"><h2>Evidence</h2>${inspector}</div></div>`;
 if(s==='entity') return `<p class="note">A record with fields you can check and relations you can follow.</p><div class="grid">
  <div class="panel"><h2>Entity types</h2>${['Character','Event','Location','Artifact','Pathway','Concept'].map((t,i)=>`<div class="row ${i===0?'sel':''}">${t}<small>${[146,35,23,11,8,17][i]} entities</small></div>`).join('')}</div>
  <div class="panel doc"><h1>${d.entity.name}</h1>
   ${d.entity.facts.map(f=>`<div class="stat"><span>${f.label}</span><b>${f.value}</b></div>`).join('')}
   <h2 style="margin-top:20px">Relations</h2>
   ${d.graph.edges.filter(e=>e[0]===d.entity.name).map(e=>`<div class="ev"><b>${e[2]}</b><br>${e[1]}<small>One evidence</small></div>`).join('')}</div>
  <div class="panel"><h2>Other names</h2>${d.entity.aliases.map(a=>`<span class="chip">${a}</span>`).join('')}
   <div class="stat"><span>confirmed facts</span><b>52</b></div><div class="stat"><span>corrected</span><b>11</b></div></div></div>`;
 if(s==='graph') return `<p class="note">The link graph drawn, with typed edges and filters.</p><div class="grid" style="grid-template-columns:200px 1fr 240px">
  <div class="panel"><h2>Filter by type</h2>${['Character','Location','Pathway','Concept'].map(t=>`<span class="chip">${t}</span>`).join('')}</div>
  <div class="panel"><h2>Relations</h2><svg viewBox="0 0 600 420">
   ${d.graph.edges.map((e,i)=>{const a=100+i*65,b=120+(i%3)*90;return `<line x1="300" y1="210" x2="${a}" y2="${b}" stroke="#594b36" stroke-width="1"/><text x="${a}" y="${b-8}" fill="#b9952f" font-size="10">${e[2]}</text>`}).join('')}
   <circle cx="300" cy="210" r="42" fill="#1c1713" stroke="#b9952f"/><text x="300" y="214" fill="#e9e1d0" text-anchor="middle" font-size="11">Klein Moretti</text>
   ${d.graph.nodes.slice(1).map((n,i)=>`<circle cx="${100+i*65}" cy="${120+(i%3)*90}" r="4" fill="#6d1f2b"/><text x="${100+i*65}" y="${138+(i%3)*90}" fill="#9a9080" font-size="10" text-anchor="middle">${n}</text>`).join('')}</svg></div>
  <div class="panel"><h2>Selected</h2><div class="stat"><span>node</span><b>Klein Moretti</b></div>
   <div class="stat"><span>links</span><b>6</b></div><div class="stat"><span>chapters</span><b>341</b></div></div></div>`;
 return `<p class="note">Ask first, refine the answer in place.</p><div class="grid" style="grid-template-columns:1fr 300px">
  <div class="panel"><input class="cmd" value="crimson moon" aria-label="Search the work"><div style="margin-top:16px">
  ${d.search.results.map(r=>`<div class="row">${r.name}<small>${r.type}, ${r.where}</small></div>`).join('')}</div></div>
  <div class="panel"><h2>Refine</h2>${['Character','Event','Chapter','Location'].map(t=>`<span class="chip">${t}</span>`).join('')}</div></div>`;
}
function renderC(s){
 const d=DATA;
 if(s==='chapter') return `<div class="sig">&#9790;</div><div class="kicker">${d.chapter.book}</div><h1>${d.chapter.title}</h1>
  <p class="body-text">${d.chapter.paras.map((p,i)=>i===1?`A gaudy and dazzling dreamworld filled with murmurs instantly shattered. <span class="reveal">The sound asleep Zhou Mingrui felt an abnormal throbbing pain in his head<span>${d.chapter.quotes[0].label}, Volume 1, chapter 1</span></span> as though someone had ruthlessly lashed at him with a pole again and again.`:p).join(' ')}</p>
  <div class="timeline"><div>Chapter 1 of 1394</div><div>Next: Chapter 2, Situation</div></div>`;
 if(s==='entity') return `<div class="sig">&#10023;</div><div class="kicker">${d.entity.type}</div><h1>${d.entity.name}</h1>
  <p class="body-text">Also called ${d.entity.aliases.join(' or ')}. ${d.entity.facts[1].value}.</p>
  <div class="timeline">${d.entity.events.map(e=>`<div>Chapter ${e.ch}. ${e.label}</div>`).join('')}</div>`;
 if(s==='graph'){const pos=[[50,50],[22,24],[78,26],[18,70],[80,72],[50,88],[50,12]];
  return `<div class="kicker">The web</div><h1>Every name, a star</h1><div class="orbit">
  ${d.graph.nodes.map((n,i)=>`<div class="node ${i===0?'core':''}" style="left:${pos[i][0]}%;top:${pos[i][1]}%">${n}</div>`).join('')}</div>`;}
 return `<div class="sig">&#9790;</div><div class="kicker">Search the whole work</div><h1>Summon a name</h1>
  <input class="searchbig" value="crimson" aria-label="Search the work">
  <div style="margin-top:32px">${d.search.results.map(r=>`<a class="result" href="#"><small>${r.type}</small>${r.name}</a>`).join('')}</div>`;
}
function cycle(step){const i=VARIANTS.findIndex(v=>v.key===variant);variant=VARIANTS[(i+step+VARIANTS.length)%VARIANTS.length].key;sync()}
document.getElementById('prev').onclick=()=>cycle(-1);
document.getElementById('next').onclick=()=>cycle(1);
addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)||document.activeElement.isContentEditable)return;
 if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;
 document.getElementById('progress').style.width=(h>0?Math.min(100,scrollY/h*100):0)+'%'},{passive:true});
render();
</script>
</body>
</html>
